name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Harness tests (local sandbox)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -v

  docker:
    name: Validate tasks in Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: RLBENCH_DOCKER_TESTS=1 pytest -v tests/test_docker.py
