[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-env-benchmark"
version = "0.1.0"
description = "Reproducible RL environments that test whether AI agents can debug real software workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gachengoh Marugu" }]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
rlbench = "rlbench.cli:main"

[tool.setuptools]
packages = ["rlbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]
